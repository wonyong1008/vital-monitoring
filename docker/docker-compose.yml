services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: vitaldb
      MYSQL_USER: vital
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: rootsecret
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "vital", "-psecret" ]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: ..
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:mysql://db:3306/vitaldb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: vital
      DB_PASSWORD: secret
      DB_DRIVER: com.mysql.cj.jdbc.Driver
      JPA_DDL_AUTO: validate
      JPA_DIALECT: org.hibernate.dialect.MySQLDialect
      AUTH_TOKEN: dev-token-change-in-prod
      VITAL_RISK_TIME_WINDOW_HOURS: 24
    depends_on:
      db:
        condition: service_healthy

volumes:
  mysql_data:
