spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: ${DB_DRIVER:com.mysql.cj.jdbc.Driver}
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: true
        dialect: ${JPA_DIALECT:org.hibernate.dialect.MySQLDialect}
  jackson:
    serialization:
      write-dates-as-timestamps: false
    time-zone: UTC

app:
  auth:
    username: ${AUTH_USERNAME:admin}
    password: ${AUTH_PASSWORD:1234}
  jwt:
    secret: ${JWT_SECRET:dGhpcy1pcy1hLXZlcnktc2VjdXJlLXNlY3JldC1rZXktZm9yLXZpdGFsLW1vbml0b3Jpbmctc3lzdGVt}
    access-token-expiry-ms: ${JWT_ACCESS_TOKEN_EXPIRY_MS:3600000}
    refresh-token-expiry-ms: ${JWT_REFRESH_TOKEN_EXPIRY_MS:604800000}
  inference:
    vital-risk-time-window-hours: ${VITAL_RISK_TIME_WINDOW_HOURS:24}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
